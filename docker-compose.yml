services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm-mvp
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - pm-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pm-data:
